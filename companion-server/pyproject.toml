[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-server"
version = "0.1.0"
description = "Reticulum companion server for rDeck - provides NTP, web search, and other services over mesh network"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rDeck Team"}
]
dependencies = [
    "rns>=0.7.0",
    "lxmf>=0.4.0",
    "textual>=0.47.0",
    "msgpack>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
companion-server = "companion_server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["companion_server*"]
