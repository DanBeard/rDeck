; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]

; *******************************************************
;  To use the A7682E, you must plug in the battery
; *******************************************************
; src_dir = examples/A7682E/test_AT
; src_dir = examples/A7682E/deep_sleep

src_dir = src


; *******************************************************
boards_dir = boards
default_envs = T-Deck-Pro
; src_dir = examples/${platformio.default_envs}

[env:emulator_64bits]
platform = native@^1.1.3
extra_scripts =
  pre:support/sdl2_paths.py
  post:support/sdl2_build_extra.py
build_flags =
  ; Add hal/sdl2 for Arduino.h stub
  -I hal/sdl2
  ; Add Crypto library include path (not auto-detected for native platform)
  -I .pio/libdeps/emulator_64bits/Crypto
  ; Define ARDUINO so microReticulum uses our Stream.h
  -D ARDUINO=100
  ; SDL drivers options
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -include config/lv_conf.h
  -D LV_USE_SDL=0
  -D SDL_HOR_RES=320
  -D SDL_VER_RES=240
  -D SDL_ZOOM=2
  ; LVGL memory options
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(128U * 1024U)"
  ; Platform flag for conditional compilation
  -D RET_PLATFORM_EMU=1
  ; Enable C++17 for std::thread etc
  -std=c++17
  ; Allow pointer-to-int casts (64-bit compatibility)
  -fpermissive
  -Wno-int-to-pointer-cast

lib_deps =
  https://github.com/attermann/Crypto.git
  microReticulum=symlink://../microReticulum

lib_ignore =
  ; Hardware-specific libraries not needed for emulator
  GxEPD2
  RadioLib
  SensorLib
  TinyGPSPlus
  XPowersLib
  BQ27220
  Adafruit TCA8418
  Adafruit BusIO
  Adafruit GFX Library
  ESP32-audioI2S
  TinyGSM
  SPI
  Wire
  FS
  SPIFFS
  EEPROM

build_src_filter =
  +<*>
  +<../hal/sdl2>
  ; Include Crypto library source files
  +<../.pio/libdeps/emulator_64bits/Crypto/*.cpp>
  ; Exclude T-Deck Pro specific files
  -<boards/TDeckPro.cpp>
  -<retHal/Screen/TDeckProScreen.cpp>
  -<retHal/Keyboard/TDeckProKeyboard.cpp>
  -<retHal/Battery/TDeckProBattery.cpp>
  -<retHal/GPS/TDeckProGPS.cpp>
  -<retHal/Lora/TDeckProLora.cpp>
  ; Exclude ESP32-specific Crypto files
  -<../.pio/libdeps/emulator_64bits/Crypto/AESEsp32.cpp>




[env:T-Deck-Pro]

platform = espressif32@6.5.0
board = T-Deck-Pro
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; extra_scripts =  ./script/pos_extra_script.py

build_flags = 
    -DBOARD_HAS_PSRAM

    ; Enable UARDUINO_ USB_ CDC_ ON_ BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Enable UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    ; -DARDUINO_USB_CDC_ON_BOOT=0

    -DDISABLE_ALL_LIBRARY_WARNINGS
    -Wnarrowing

    ; LVGL config
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_INCLUDE_SIMPLE
    -include config/lv_conf.h
    -DTINY_GSM_MODEM_SIM7672

    ;  -DLOG_PORT=Serial

    ; Debug output
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_DIAGNOSTIC_OUTPUT=1
    -D RET_PLATFORM_TDECKPRO=1

lib_deps = 
    ;zinggjm/GxEPD2@1.5.5
    ;jgromes/RadioLib@6.4.2
    ;lewisxhe/SensorLib@^0.2.0
    ;mikalhart/TinyGPSPlus @ ^1.0.3
    ; vshymanskyy/TinyGSM@^0.12.0
    ;lvgl/lvgl @ ~8.3.9
    ; lewisxhe/XPowersLib @ ^0.2.4
    ; adafruit/Adafruit TCA8418 @ ^1.0.1
    ; adafruit/Adafruit BusIO @ ^1.14.4
    ; olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    ;adafruit/Adafruit GFX Library@^1.11.10
    ; esphome/ESP32-audioI2S#v3.0.12
    ;ArduinoJson@7.1.0
    SPI
    Wire
    FS
    SPIFFS
    EEPROM
    https://github.com/attermann/Crypto.git
    ;https://github.com/stumpigit/microReticulum.git
    microReticulum=symlink://../microReticulum
    

