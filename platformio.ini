; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]

; *******************************************************
;  To use the A7682E, you must plug in the battery
; *******************************************************
; src_dir = examples/A7682E/test_AT
; src_dir = examples/A7682E/deep_sleep

src_dir = src


; *******************************************************
boards_dir = boards
default_envs = T-Deck-Pro
; src_dir = examples/${platformio.default_envs}

[env:emulator_64bits]
platform = native@^1.1.3
extra_scripts = 
  pre:support/sdl2_paths.py ; Tries to find SDL2 include and lib paths on your system - specifically for MacOS w/ Homebrew
  post:support/sdl2_build_extra.py
build_flags =
  ${env.build_flags}
  ; -D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
  -D LV_LOG_PRINTF=1
  ; Add recursive dirs for hal headers search
  !python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
  -lSDL2
  ; SDL drivers options
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_DRV_NO_CONF
  -D LV_USE_SDL
  -D SDL_HOR_RES=320
  -D SDL_VER_RES=240  
  -D SDL_ZOOM=1
  -D LV_SDL_INCLUDE_PATH="\"SDL2/SDL.h\""

  ; LVGL memory options, setup for the demo to run properly
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(128U * 1024U)"
  -D RET_PLATFORM_EMU=1
  
lib_deps =
  ${env.lib_deps}
   https://github.com/attermann/Crypto.git
   ;https://github.com/stumpigit/microReticulum.git
   microReticulum=symlink://../microReticulum
   
build_src_filter =
  +<*>
  +<../hal/sdl2>
  ; Force compile LVGL demo, remove when working on your own project
  ;+<../.pio/libdeps/emulator_64bits/lvgl/demos>




[env:T-Deck-Pro]

platform = espressif32@6.5.0
board = T-Deck-Pro
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; extra_scripts =  ./script/pos_extra_script.py

build_flags = 
    -DBOARD_HAS_PSRAM

    ; Enable UARDUINO_ USB_ CDC_ ON_ BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Enable UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    ; -DARDUINO_USB_CDC_ON_BOOT=0

    -DDISABLE_ALL_LIBRARY_WARNINGS
    -Wnarrowing

    ; LVGL config
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_INCLUDE_SIMPLE
    -include config/lv_conf.h
    -DTINY_GSM_MODEM_SIM7672

    ;  -DLOG_PORT=Serial

    ; Debug output
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_DIAGNOSTIC_OUTPUT=1
    -D RET_PLATFORM_TDECKPRO=1

lib_deps = 
    ;zinggjm/GxEPD2@1.5.5
    ;jgromes/RadioLib@6.4.2
    ;lewisxhe/SensorLib@^0.2.0
    ;mikalhart/TinyGPSPlus @ ^1.0.3
    ; vshymanskyy/TinyGSM@^0.12.0
    ;lvgl/lvgl @ ~8.3.9
    ; lewisxhe/XPowersLib @ ^0.2.4
    ; adafruit/Adafruit TCA8418 @ ^1.0.1
    ; adafruit/Adafruit BusIO @ ^1.14.4
    ; olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    ;adafruit/Adafruit GFX Library@^1.11.10
    ; esphome/ESP32-audioI2S#v3.0.12
    ;ArduinoJson@7.1.0
    SPI
    Wire
    FS
    SPIFFS
    EEPROM
    https://github.com/attermann/Crypto.git
    ;https://github.com/stumpigit/microReticulum.git
    microReticulum=symlink://../microReticulum
    

